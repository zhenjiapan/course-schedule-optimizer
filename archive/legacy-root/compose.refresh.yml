services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: planner
      POSTGRES_USER: planner
      POSTGRES_PASSWORD: planner
    ports:
      - "127.0.0.1:55433:5432"
    volumes:
      - planner-refresh-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U planner -d planner"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://planner:planner@db:5432/planner
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/api/health', timeout=3).close()"]
      interval: 5s
      timeout: 4s
      retries: 12
    restart: unless-stopped
  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:3101:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health', {signal: AbortSignal.timeout(3000)}).then(r => {if (!r.ok) process.exitCode = 1}).catch(() => {process.exitCode = 1})"]
      interval: 5s
      timeout: 4s
      retries: 12
    restart: unless-stopped
volumes:
  planner-refresh-data:
