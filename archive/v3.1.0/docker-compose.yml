services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: planner
      POSTGRES_USER: planner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-planner}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - planner-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U planner -d planner"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  planner-data:
